[project]
name = "cryptorecorder"
# uv requires a PEP 621 version even for a non-packaged virtual project.  This
# neutral value identifies only the dependency environment; the application
# release is read exclusively from the repository's VERSION file.
version = "0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiohttp>=3.11.0",
  "numpy>=1.26.4",
  "pyarrow>=15.0.0",
  "zstandard>=0.21.0",
]

[project.optional-dependencies]
reconstruction = [
  "nautilus_trader==1.225.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0,<10.0.0",
  "pytest-asyncio>=1.3.0,<2.0.0",
]

[tool.uv]
package = false
default-groups = []
